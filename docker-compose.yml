name: roofrank
services:
  lucenia:
    image: lucenia/lucenia:0.11.0
    container_name: roofrank-lucenia
    environment:
      - cluster.name=roofrank
      - node.name=roofrank-node
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - "LUCENIA_JAVA_OPTS=-Xms512m -Xmx512m"
      - LUCENIA_INITIAL_ADMIN_PASSWORD=RoofRank!2026Dev
      - plugins.license.certificate_filepath=config/trial.crt
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${LUCENIA_PORT:-9200}:9200"
    volumes:
      - ./trial.crt:/usr/share/lucenia/config/trial.crt:ro
      - lucenia-data:/usr/share/lucenia/data
volumes:
  lucenia-data:
